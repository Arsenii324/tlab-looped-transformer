name: tlab-trainL-s1
desc: seed-1 replication of the train-at-L sweep, to test whether the t/L collapse survives seed noise
cmd: >
  export WANDB_API_KEY="$WANDB_API_KEY";  # set in the launching shell -- never stored in this file
  export WANDB_PROJECT=tlab-loop;
  date +%s;
  python -c "import torch,sys; sys.exit(0 if torch.cuda.is_available() else 1)" 2>/dev/null
  && echo "TORCH_PREINSTALLED_OK skipping pip"
  || pip install -q --root-user-action=ignore torch --index-url https://download.pytorch.org/whl/cu121;
  date +%s;
  python main.py
env:
  docker:
    image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
  python:
    type: manual
    version: "3.11"
    requirements-file: requirements.txt
    local-paths:
      - main.py
outputs:
  - results.json
  - "*_last.pt"
cloud-instance-type: gt4.1
