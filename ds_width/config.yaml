name: tlab-width-s0
desc: "sec4.31 follow-up: is the TRAINED depth-key rank collapse width-independent? Same tied control at hidden 224/448/896 (2.7M/9.1M/32.6M params), 2.5M tokens each, in-job, seed 0. Rank at init is flat across this range; this measures whether training collapses it equally at every width. FOLLOW-UP -- lands after the submission deadline."
cmd: >
  date +%s;
  python -c "import torch,sys; sys.exit(0 if torch.cuda.is_available() else 1)" 2>/dev/null
  && echo "TORCH_PREINSTALLED_OK skipping pip"
  || pip install -q --root-user-action=ignore torch --index-url https://download.pytorch.org/whl/cu121;
  pip install -q --root-user-action=ignore tokenizers datasets;
  date +%s;
  python main.py
env:
  docker:
    image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
  python:
    type: manual
    version: "3.11"
    requirements-file: requirements.txt
    local-paths:
      - main.py
outputs:
  - results.json
  - wd_224_s0_last.pt
  - wd_448_s0_last.pt
  - wd_896_s0_last.pt
cloud-instance-type: gt4.1
