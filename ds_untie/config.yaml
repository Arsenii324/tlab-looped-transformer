name: tlab-untie-s0
desc: "sec4.28 causal test: does RAISING depth-key rank make the working depth gate act? W_K in 4 loop-index buckets (rank 1.603->5.742, 9,967,776 params) with and without the scale-invariant gate, vs in-job tied control. Seed 0, 3.5M tokens/arm, Tesla T4."
cmd: >
  date +%s;
  python -c "import torch,sys; sys.exit(0 if torch.cuda.is_available() else 1)" 2>/dev/null
  && echo "TORCH_PREINSTALLED_OK skipping pip"
  || pip install -q --root-user-action=ignore torch --index-url https://download.pytorch.org/whl/cu121;
  pip install -q --root-user-action=ignore tokenizers datasets;
  date +%s;
  python main.py
env:
  docker:
    image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
  python:
    type: manual
    version: "3.11"
    requirements-file: requirements.txt
    local-paths:
      - main.py
outputs:
  - results.json
  - ut_ctrl_s0_last.pt
  - ut_b4_s0_last.pt
  - ut_b4_gate_s0_last.pt
cloud-instance-type: gt4.1
