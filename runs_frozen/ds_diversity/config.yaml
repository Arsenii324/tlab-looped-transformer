name: tlab-diversity-control-s0
desc: "Does operator DIVERSITY contribute, or is it just added capacity? control vs lora_r4 (cycled) vs lora_r4 with branch index FIXED at 0 -- identical params, zero diversity. In-job, 2.5M tokens/arm, seed 0."
cmd: >
  date +%s;
  python -c "import torch,sys; sys.exit(0 if torch.cuda.is_available() else 1)" 2>/dev/null
  && echo "TORCH_PREINSTALLED_OK skipping pip"
  || pip install -q --root-user-action=ignore torch --index-url https://download.pytorch.org/whl/cu121;
  pip install -q --root-user-action=ignore tokenizers datasets;
  date +%s;
  python main.py
env:
  docker:
    image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
  python:
    type: manual
    version: "3.11"
    requirements-file: requirements.txt
    local-paths:
      - main.py
outputs:
  - results.json
  - dv_control_s0_last.pt
  - dv_lora_r4_s0_last.pt
  - dv_lora_fixed0_s0_last.pt
cloud-instance-type: gt4.1
